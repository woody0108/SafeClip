<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeClip 회사 검토</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">SC</div>
        <div>
          <strong>SafeClip</strong>
          <span>회사 검토 서버</span>
        </div>
      </div>
      <nav aria-label="주요 메뉴">
        <button id="review-nav" class="nav-item active" type="button" aria-current="page">영상 검토</button>
        <button id="ask-nav" class="nav-item" type="button">문의 응답</button>
      </nav>
      <p class="network-note">내부망 전용으로 운영하세요.</p>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dashboard</p>
          <h1>제출 영상 검토</h1>
        </div>
        <button id="refresh-button" class="ghost-button" type="button">새로고침</button>
      </header>

      <section id="review-view">
      <section class="metrics" aria-label="제출 요약">
        <article>
          <span>전체 제출</span>
          <strong id="metric-total">0</strong>
        </article>
        <article>
          <span>검토 대기</span>
          <strong id="metric-waiting">0</strong>
        </article>
        <article>
          <span>검토 완료</span>
          <strong id="metric-completed">0</strong>
        </article>
      </section>
      </section>

      <section id="ask-view" class="hidden">
        <section class="review-layout">
          <section class="panel video-panel" aria-label="문의 내용">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Ask</p>
                <h2 id="selected-ask-title">문의를 선택하세요</h2>
              </div>
            </div>
            <dl class="detail-grid">
              <div>
                <dt>문의자 ID</dt>
                <dd id="ask-detail-id">-</dd>
              </div>
              <div>
                <dt>질문 시각</dt>
                <dd id="ask-detail-time">-</dd>
              </div>
              <div class="wide">
                <dt>질문</dt>
                <dd id="ask-detail-question">-</dd>
              </div>
            </dl>
            <label class="answer-label" for="ask-answer-input">대답</label>
            <textarea id="ask-answer-input" class="answer-input" rows="6"></textarea>
            <button id="ask-save-button" class="primary-button" type="button" disabled>대답 저장</button>
          </section>

          <section class="panel list-panel" aria-label="문의 목록">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Questions</p>
                <h2>문의 목록</h2>
              </div>
            </div>
            <div class="tabs compact-tabs" role="tablist" aria-label="문의 답변 상태">
              <button class="tab active" type="button" data-ask-filter="all">전체</button>
              <button class="tab" type="button" data-ask-filter="waiting">미답변</button>
              <button class="tab" type="button" data-ask-filter="answered">답변완료</button>
            </div>
            <div id="ask-list" class="submission-list"></div>
          </section>
        </section>
      </section>

      <section id="review-layout" class="review-layout">
        <section class="panel video-panel" aria-label="제출 파일 보기">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Files</p>
              <h2 id="selected-title">제출을 선택하세요</h2>
            </div>
            <span id="selected-status" class="status-chip">대기</span>
          </div>

          <div class="tabs" role="tablist" aria-label="파일 종류">
            <button id="file-tab-all" class="tab active" type="button" data-file-filter="all">전체</button>
            <button id="file-tab-video" class="tab" type="button" data-file-filter="video">비디오</button>
            <button id="file-tab-photo" class="tab" type="button" data-file-filter="photo">사진</button>
          </div>

          <div id="attachment-list" class="attachment-list" aria-label="첨부 파일 목록"></div>

          <div class="video-frame">
            <video id="review-video" controls preload="metadata"></video>
            <img id="review-image" alt="제출 사진">
            <div id="video-placeholder" class="video-placeholder">제출 목록에서 영상을 선택하세요.</div>
          </div>

          <dl class="detail-grid">
            <div>
              <dt>제출 ID</dt>
              <dd id="detail-id">-</dd>
            </div>
            <div>
              <dt>제출자</dt>
              <dd id="detail-user">-</dd>
            </div>
            <div>
              <dt>제출 시간</dt>
              <dd id="detail-submitted">-</dd>
            </div>
            <div>
              <dt>일시</dt>
              <dd id="detail-incident-time">-</dd>
            </div>
            <div>
              <dt>위치</dt>
              <dd id="detail-location">-</dd>
            </div>
            <div>
              <dt>신고 유형</dt>
              <dd id="detail-type">-</dd>
            </div>
            <div>
              <dt>파일명</dt>
              <dd id="detail-file">-</dd>
            </div>
            <div>
              <dt>파일 크기</dt>
              <dd id="detail-size">-</dd>
            </div>
            <div class="wide">
              <dt>신고 내용</dt>
              <dd id="detail-memo">-</dd>
            </div>
            <div id="detail-company-comment-row" class="wide">
              <dt id="detail-company-comment-label">처리 의견</dt>
              <dd id="detail-company-comment">-</dd>
            </div>
          </dl>

          <div>
            <p class="eyebrow">Status</p>
            <div id="status-actions" class="status-actions" aria-label="상태 변경"></div>
          </div>
          <p id="action-message" class="message"></p>
        </section>

        <section class="panel list-panel" aria-label="최근 제출 목록">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Submissions</p>
              <h2>최근 제출 목록</h2>
            </div>
          </div>
          <div class="tabs compact-tabs" role="tablist" aria-label="제출 상태">
            <button class="tab active" type="button" data-submission-filter="all">전체</button>
            <button class="tab" type="button" data-submission-filter="waiting">대기중</button>
          </div>
          <div id="submission-list" class="submission-list"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
